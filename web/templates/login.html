{{define "content"}}
<div class="login card">
  <h1>Masuk OKEBOS</h1>
  <form method="post" action="/login" class="stack">
    <label>Username</label><input name="username" autofocus required>
    <label>Password</label><input name="password" type="password" required>
    <p><button class="btn" style="width:100%">Masuk</button></p>
  </form>
  <p class="hint">Akun demo: admin/admin123, walikota/walikota123, opd_pu / opd_dikbud / opd_dinkes (password opd123).</p>
</div>
{{end}}
